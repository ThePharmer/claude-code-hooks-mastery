[pytest]
# Pytest configuration for Claude Code Hooks Mastery

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for organizing tests
markers =
    security: Security-critical tests (deselect with '-m "not security"')
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests

# Minimum Python version
minversion = 3.8

# Console output format
console_output_style = progress

# Warning filters
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
